trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread'

packages:
  - 'lib'
  - 'studio'
  - 'web'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  sharp: false
  workerd: false
packageExtensions:
  # Its types import from `react`, which only resolves to types if @types/react is linked beside it
  '@dnd-kit/react':
    peerDependencies:
      '@types/react': '*'
  starlight-changelogs@^0.7.0:
    dependencies:
      '@types/mdast': 4.0.4
    peerDependencies:
      astro: '*'
minimumReleaseAgeExclude:
  - starlight-changelogs@0.7.0
  - '@team581/starlight-theme@1.0.0'
  - wpilib-struct@1.0.2
  - wpilog-parser@4.1.0
  - '@ui-sdk/core@0.1.0-beta.5'
  - '@ui-sdk/react@0.1.0-beta.5'
patchedDependencies:
  '@ntcore-ts/client': patches/@ntcore-ts__client.patch
