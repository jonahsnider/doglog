trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread'

saveExact: true

packages:
  - 'cloud'
  - 'lib'
  - 'studio'
  - 'web'
catalog:
  three-mesh-bvh: 0.10.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  # Their postinstall scripts only print a suggestion to run `astryx init`
  '@astryxdesign/cli': false
  '@astryxdesign/core': false
  esbuild: true
  sharp: true
  workerd: true
packageExtensions:
  # Its test entry point ships TypeScript that imports both packages.
  '@convex-dev/auth@2.1.0':
    peerDependencies:
      convex-test: '*'
      vite: '*'
    peerDependenciesMeta:
      convex-test:
        optional: true
      vite:
        optional: true
  # Its types import from `react`, which only resolves to types if @types/react is linked beside it
  '@dnd-kit/react':
    peerDependencies:
      '@types/react': '*'
  usehooks-ts:
    peerDependencies:
      '@types/react': '*'
  '@astryxdesign/core':
    peerDependencies:
      '@types/react': '*'
  # Their types also import from `three`, which has no types of its own
  '@react-three/fiber':
    peerDependencies:
      '@types/react': '*'
      '@types/three': '*'
  '@react-three/drei':
    peerDependencies:
      '@types/react': '*'
      '@types/three': '*'
  three-stdlib:
    peerDependencies:
      '@types/three': '*'
  three-mesh-bvh:
    peerDependencies:
      '@types/three': '*'
  # A drei dependency that imports `react` without declaring it
  tunnel-rat:
    peerDependencies:
      react: '*'
  starlight-changelogs@^0.7.0:
    dependencies:
      '@types/mdast': 4.0.4
    peerDependencies:
      astro: '*'
minimumReleaseAgeExclude:
  - starlight-changelogs@0.7.0
  - '@team581/starlight-theme@1.0.0'
  - wpilib-struct@1.0.2 || 1.1.1
  - wpilog-parser@4.2.1 || 4.4.1
  - '@ui-sdk/core@0.1.0-beta.5'
  - '@ui-sdk/react@0.1.0-beta.5'
  - sentry@0.50.0
  - '@ntcore-ts/client@2.0.0'
  - '@team581/astryx-theme@1.0.1'
  - hoot-parser@1.0.0 || 1.1.0
  - wpilib-protobuf@1.0.1
overrides:
  # The Sentry Vite plugin's upload step in sentry 0.49 doesn't recognize debug IDs in backtick strings, which Vite+'s
  # minifier produces, so it injects a second one into the uploaded copy and every stack frame maps one line off
  '@sentry/bundler-plugins>sentry': 0.51.0
  # Both copies augment BufferGeometry.boundsTree, so Studio and Drei must use the same version.
  '@react-three/drei>three-mesh-bvh': 'catalog:'
patchedDependencies:
  '@convex-dev/auth@2.1.0': patches/@convex-dev__auth@2.1.0.patch
  '@ntcore-ts/client@2.0.0': patches/@ntcore-ts__client@2.0.0.patch
  '@tanstack/store': patches/@tanstack__store.patch
  js-aruco2@2.0.0: patches/js-aruco2@2.0.0.patch
permissions:
  '@tanstack/react-hotkeys':
    skills: true
  '@tanstack/react-router':
    skills: true
  '@tanstack/router-plugin':
    skills: true
  '@team581/astryx-theme':
    skills: true
  '@ui-sdk/core':
    skills: true
  void:
    skills: true
  wpilog-parser:
    skills: false
