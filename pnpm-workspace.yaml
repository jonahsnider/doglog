trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread'

saveExact: true

packages:
  - 'cloud'
  - 'lib'
  - 'studio'
  - 'web'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
packageExtensions:
  # Its types import from `react`, which only resolves to types if @types/react is linked beside it
  '@dnd-kit/react':
    peerDependencies:
      '@types/react': '*'
  usehooks-ts:
    peerDependencies:
      '@types/react': '*'
  # Their types also import from `three`, which has no types of its own
  '@react-three/fiber':
    peerDependencies:
      '@types/react': '*'
      '@types/three': '*'
  '@react-three/drei':
    peerDependencies:
      '@types/react': '*'
      '@types/three': '*'
  three-stdlib:
    peerDependencies:
      '@types/three': '*'
  # A drei dependency that imports `react` without declaring it
  tunnel-rat:
    peerDependencies:
      react: '*'
  starlight-changelogs@^0.7.0:
    dependencies:
      '@types/mdast': 4.0.4
    peerDependencies:
      astro: '*'
minimumReleaseAgeExclude:
  - starlight-changelogs@0.7.0
  - '@team581/starlight-theme@1.0.0'
  - wpilib-struct@1.0.2
  - wpilog-parser@4.2.1
  - '@ui-sdk/core@0.1.0-beta.5'
  - '@ui-sdk/react@0.1.0-beta.5'
  - sentry@0.50.0
  - '@interfere/landmines@0.1.1'
overrides:
  # The Sentry Vite plugin's upload step in sentry 0.49 doesn't recognize debug IDs in backtick strings, which Vite+'s
  # minifier produces, so it injects a second one into the uploaded copy and every stack frame maps one line off
  '@sentry/bundler-plugins>sentry': 0.50.0
patchedDependencies:
  '@ntcore-ts/client': patches/@ntcore-ts__client.patch
  '@tanstack/store': patches/@tanstack__store.patch
permissions:
  '@tanstack/react-hotkeys':
    skills: true
  '@tanstack/react-router':
    skills: true
  '@tanstack/router-plugin':
    skills: true
  '@ui-sdk/core':
    skills: true
  void:
    skills: true
  wpilog-parser:
    skills: false
