on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['lib--release_created'] }}
      tag_name: ${{ steps.release.outputs['lib--tag_name'] }}
      version: ${{ steps.release.outputs['lib--version'] }}
      studio_release_created: ${{ steps.release.outputs['studio--release_created'] }}
      studio_tag_name: ${{ steps.release.outputs['studio--tag_name'] }}
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
    concurrency:
      group: doglog-publish
      cancel-in-progress: false
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build release
        run: ./gradlew build :lib:plainJavadocJar
      - name: Check Maven Central
        id: central
        run: |
          http_status="$(curl --head --silent --show-error --connect-timeout 10 --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            "https://repo.maven.apache.org/maven2/dev/doglog/doglog/$RELEASE_VERSION/doglog-$RELEASE_VERSION.jar")"
          case "$http_status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected Maven Central response: $http_status" >&2; exit 1 ;;
          esac
      - name: Publish to Maven Central
        if: steps.central.outputs.published != 'true'
        run: ./gradlew :lib:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      - name: Create copy of vendordep.json
        run: cp vendordep.json "DogLog-$RELEASE_VERSION.json"
      - name: Create Vendor JSON Repo PR
        uses: wpilibsuite/vendor-json-repo/.github/actions/add_vendordep@main
        with:
          repo: jonahsnider/vendor-json-repo
          token: ${{ secrets.DOGLOG_VENDORDEP_ACCESS_TOKEN }}
          vendordep_file: ${{ github.workspace }}/DogLog-${{ needs.release-please.outputs.version }}.json
          pr_title: 'Add DogLog v${{ needs.release-please.outputs.version }}'
          pr_branch: 'doglog-v${{ needs.release-please.outputs.version }}'

  docs:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current docs
        uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      - name: Build docs
        run: pnpm build
        working-directory: web
      - name: Check vendordep is downloadable
        id: central
        run: |
          version="$(cat version.txt)"
          http_status="$(curl --head --silent --show-error --connect-timeout 10 --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            "https://repo.maven.apache.org/maven2/dev/doglog/doglog/$version/doglog-$version.jar")"
          case "$http_status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo '::notice::Docs deployment deferred until the vendordep is available on Maven Central.' ;;
            *) echo "Unexpected Maven Central response: $http_status" >&2; exit 1 ;;
          esac
      - name: Publish docs to Cloudflare Workers
        if: steps.central.outputs.published == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          workingDirectory: web

  studio-desktop:
    name: Studio desktop (${{ matrix.name }})
    needs: release-please
    if: needs.release-please.outputs.studio_release_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Separate jobs so the architectures build in parallel, both on Apple silicon since cross-compiling takes about as long
          - name: macOS Apple silicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            runner: windows-latest
          - name: Linux
            # The oldest supported Ubuntu, so the AppImage runs on distros with an older glibc
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.release-please.outputs.studio_tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.studio_tag_name }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Rebuilding the man page index after installing is slow and unused in CI
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          # Downloading usually takes under a minute, but a slow mirror can drag it out until the job times out
          # Retrying makes a new connection and keeps the packages already downloaded
          for attempt in 1 2 3; do
            sudo timeout 3m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --download-only libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::Downloading Linux dependencies took too long, retrying"
          done
          # Installed separately so the timeout can't interrupt dpkg partway through
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          # The macOS jobs share a runner OS, so keep their caches apart
          cache-key: ${{ matrix.target }}
          # A new lint in stable Rust shouldn't block shipping a build
          build-warnings: warn
          cache-workspaces: studio/src-tauri -> target
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      - name: Get release ID
        id: release
        shell: bash
        run: echo "id=$(gh release view "$TAG_NAME" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"
      # `tauri.linux.conf.json` splits the debug info into its own file before bundling, so cargo has to leave it in
      - name: Keep Linux debug info for Sentry
        if: runner.os == 'Linux'
        run: |
          echo CARGO_PROFILE_RELEASE_STRIP=none >> "$GITHUB_ENV"
          echo CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=off >> "$GITHUB_ENV"
      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          projectPath: studio
          # Using the ID instead of the tag keeps the release notes from release-please
          releaseId: ${{ steps.release.outputs.id }}
          updaterJsonPreferNsis: true
          # Only release builds make updater artifacts, so local builds don't need the signing key
          args: ${{ matrix.target && format('--target {0}', matrix.target) }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
      # Lets Sentry show function names and source lines for panics, a missing upload shouldn't block the release
      - name: Upload debug symbols to Sentry
        continue-on-error: true
        shell: bash
        working-directory: studio
        run: pnpm exec sentry debug-files upload --include-sources src-tauri/target/${{ matrix.target }}/release/doglog[-_]studio*
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: jonah-snider
          SENTRY_PROJECT: doglog-studio

  studio-desktop-manifest:
    name: Publish Studio update manifest
    needs: [release-please, studio-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.release-please.outputs.studio_tag_name }}
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      - name: Download manifest from release
        run: gh release download "$TAG_NAME" --pattern latest.json
      # Each build job merges its platform into the release's manifest, so make sure none were lost before publishing
      - name: Check every platform is in the manifest
        run: jq -e '.platforms | has("darwin-aarch64") and has("darwin-x86_64") and has("windows-x86_64") and has("linux-x86_64")' latest.json
      # release-please makes Studio releases drafts, since assets can't be uploaded once an immutable release is published
      # The manifest links to the release's assets, which can't be downloaded while it's a draft
      - name: Publish release
        run: gh release edit "$TAG_NAME" --draft=false
      # Release asset names include the version, so the website links to copies with fixed names instead
      # Published before the manifest so the website never offers a version the updater doesn't know about yet
      - name: Publish installers
        run: |
          set -euo pipefail
          publish() {
            local pattern="$1" key="$2"
            local dir
            dir="$(mktemp -d)"
            gh release download "$TAG_NAME" --pattern "$pattern" --dir "$dir"
            local files=("$dir"/*)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Expected 1 asset matching $pattern, found ${#files[@]}" >&2
              exit 1
            fi
            pnpm --dir studio exec wrangler r2 object put "doglog-updates/studio/$key" --file "${files[0]}" --content-type application/octet-stream --cache-control 'public, max-age=300' --remote
          }
          publish '*_aarch64.dmg' DogLog-Studio-macos-apple-silicon.dmg
          publish '*_x64.dmg' DogLog-Studio-macos-intel.dmg
          publish '*-setup.exe' DogLog-Studio-windows-setup.exe
          publish '*.AppImage' DogLog-Studio-linux.AppImage
          publish '*.deb' DogLog-Studio-linux.deb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish manifest
        run: pnpm --dir studio exec wrangler r2 object put doglog-updates/studio/latest.json --file ../latest.json --content-type application/json --cache-control 'public, max-age=300' --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
