on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['lib--release_created'] }}
      tag_name: ${{ steps.release.outputs['lib--tag_name'] }}
      version: ${{ steps.release.outputs['lib--version'] }}
      studio_release_created: ${{ steps.release.outputs['studio--release_created'] }}
      studio_tag_name: ${{ steps.release.outputs['studio--tag_name'] }}
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
    concurrency:
      group: doglog-publish
      cancel-in-progress: false
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build release
        run: ./gradlew build :lib:plainJavadocJar
      - name: Check Maven Central
        id: central
        run: |
          http_status="$(curl --head --silent --show-error --connect-timeout 10 --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            "https://repo.maven.apache.org/maven2/dev/doglog/doglog/$RELEASE_VERSION/doglog-$RELEASE_VERSION.jar")"
          case "$http_status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected Maven Central response: $http_status" >&2; exit 1 ;;
          esac
      - name: Publish to Maven Central
        if: steps.central.outputs.published != 'true'
        run: ./gradlew :lib:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      - name: Create copy of vendordep.json
        run: cp vendordep.json "DogLog-$RELEASE_VERSION.json"
      - name: Create Vendor JSON Repo PR
        uses: wpilibsuite/vendor-json-repo/.github/actions/add_vendordep@f3c94a13ef006b9af78ef0a654d9d198909a51b7 # main
        with:
          repo: jonahsnider/vendor-json-repo
          token: ${{ secrets.DOGLOG_VENDORDEP_ACCESS_TOKEN }}
          vendordep_file: ${{ github.workspace }}/DogLog-${{ needs.release-please.outputs.version }}.json
          pr_title: 'Add DogLog v${{ needs.release-please.outputs.version }}'
          pr_branch: 'doglog-v${{ needs.release-please.outputs.version }}'

  docs:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - name: Build docs
        run: pnpm build
        working-directory: web
      - name: Check vendordep is downloadable
        id: central
        run: |
          version="$(cat version.txt)"
          http_status="$(curl --head --silent --show-error --connect-timeout 10 --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            "https://repo.maven.apache.org/maven2/dev/doglog/doglog/$version/doglog-$version.jar")"
          case "$http_status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo '::notice::Docs deployment deferred until the vendordep is available on Maven Central.' ;;
            *) echo "Unexpected Maven Central response: $http_status" >&2; exit 1 ;;
          esac
      - name: Publish docs to Cloudflare Workers
        if: steps.central.outputs.published == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          workingDirectory: web

  studio-desktop:
    name: Studio desktop (${{ matrix.name }})
    needs: release-please
    if: needs.release-please.outputs.studio_release_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            runner: windows-latest
          - name: Linux
            # The oldest supported Ubuntu, so the AppImage runs on distros with an older glibc
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.release-please.outputs.studio_tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.studio_tag_name }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - name: Get release ID
        id: release
        shell: bash
        run: echo "id=$(gh release view "$TAG_NAME" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"
      - name: Build and upload to release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: studio
          # Using the ID instead of the tag keeps the release notes from release-please
          releaseId: ${{ steps.release.outputs.id }}
          updaterJsonPreferNsis: true
          # Only release builds make updater artifacts, so local builds don't need the signing key
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

  studio-desktop-manifest:
    name: Publish Studio update manifest
    needs: [release-please, studio-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.release-please.outputs.studio_tag_name }}
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - name: Download manifest from release
        run: gh release download "$TAG_NAME" --pattern latest.json
      # Each build job merges its platform into the release's manifest, so make sure none were lost before publishing
      - name: Check every platform is in the manifest
        run: jq -e '.platforms | has("darwin-aarch64") and has("darwin-x86_64") and has("windows-x86_64") and has("linux-x86_64")' latest.json
      # Release asset names include the version, so the website links to copies with fixed names instead
      # Published before the manifest so the website never offers a version the updater doesn't know about yet
      - name: Publish installers
        run: |
          set -euo pipefail
          publish() {
            local pattern="$1" key="$2"
            local dir
            dir="$(mktemp -d)"
            gh release download "$TAG_NAME" --pattern "$pattern" --dir "$dir"
            local files=("$dir"/*)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Expected 1 asset matching $pattern, found ${#files[@]}" >&2
              exit 1
            fi
            pnpm --dir studio exec wrangler r2 object put "doglog-updates/studio/$key" --file "${files[0]}" --content-type application/octet-stream --cache-control 'public, max-age=300' --remote
          }
          publish '*.dmg' DogLog-Studio-macos.dmg
          publish '*-setup.exe' DogLog-Studio-windows-setup.exe
          publish '*.AppImage' DogLog-Studio-linux.AppImage
          publish '*.deb' DogLog-Studio-linux.deb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish manifest
        run: pnpm --dir studio exec wrangler r2 object put doglog-updates/studio/latest.json --file ../latest.json --content-type application/json --cache-control 'public, max-age=300' --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
