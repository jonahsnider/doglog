name: autofix.ci # needed to securely identify the workflow

on: push

permissions:
  contents: read

jobs:
  autofix:
    if: github.ref_name != 'release-please--branches--main' && github.head_ref != 'release-please--branches--main'
    name: Autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Fix Error Prone issues
        run: ./gradlew assemble
        env:
          ERRORPRONE_AUTOFIX: 1

      - name: Format library with Spotless
        run: ./gradlew spotlessApply

      - name: Format test project with Spotless
        run: ./gradlew spotlessApply
        working-directory: test-project

      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Format docs with Oxfmt
        run: pnpm format:write

      - name: Fix Studio lint and formatting issues
        run: pnpm check:fix
        working-directory: studio
        continue-on-error: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Fix Studio Python lint and formatting issues
        run: uv run --locked ruff check --fix && uv run --locked ruff format
        working-directory: studio/scripts/field3d
        continue-on-error: true

      - name: Fix Knip issues
        run: pnpm knip --fix
        continue-on-error: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          components: rustfmt
          cache: false

      - name: Format Studio Rust code
        run: cargo fmt --all
        working-directory: studio/src-tauri

      - name: Run autofix.ci
        uses: autofix-ci/action@v1.3.4
        with:
          commit-message: 'refactor: run autofix.ci'
