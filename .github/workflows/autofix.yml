name: autofix.ci # needed to securely identify the workflow

on: [push, pull_request]

permissions:
  contents: read

jobs:
  autofix:
    if: github.ref_name != 'release-please--branches--main' && github.head_ref != 'release-please--branches--main'
    name: Autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Fix Error Prone issues
        run: ./gradlew assemble
        env:
          ERRORPRONE_AUTOFIX: 1

      - name: Format library with Spotless
        run: ./gradlew spotlessApply

      - name: Format test project with Spotless
        run: ./gradlew spotlessApply
        working-directory: test-project

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true

      - name: Format docs with Oxfmt
        run: pnpm format:write

      - name: Run autofix.ci
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
        with:
          commit-message: 'style: run autofix.ci'
