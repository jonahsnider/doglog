name: CI

on: [push, pull_request]

jobs:
  assemble:
    name: Assemble

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Assemble project
        run: ./gradlew assemble :lib:plainJavadocJar :lib:generatePomFileForMavenPublication :lib:generateMetadataFileForMavenPublication
  style:
    name: Check formatting

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs: [assemble]

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Check formatting
        run: ./gradlew spotlessCheck
  infer:
    name: Infer

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs: [assemble]

    env:
      INFER_VERSION: v1.3.0

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Cache Infer
        id: cache-infer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/infer
          key: infer-linux-x86_64-${{ env.INFER_VERSION }}
      - name: Install Infer
        if: steps.cache-infer.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/infer
          curl -sL "https://github.com/facebook/infer/releases/download/${INFER_VERSION}/infer-linux-x86_64-${INFER_VERSION}.tar.xz" \
            | tar xJ -C /tmp/infer
      - name: Add Infer to PATH
        run: echo "/tmp/infer/infer-linux-x86_64-${INFER_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Run Infer
        run: ./gradlew infer -PinferFailOnIssue

  assemble-test-project:
    name: Assemble test project

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs: [assemble]

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Assemble DogLog
        run: ./gradlew assemble
      - name: Assemble test project
        run: ./gradlew assemble
        working-directory: test-project
  style-test-project:
    name: Check test project formatting

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs: [assemble]

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Check formatting
        run: ./gradlew spotlessCheck
        working-directory: test-project
  javadoc:
    name: Publish Javadoc

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: [assemble]

    timeout-minutes: 10

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build
        run: ./gradlew javadoc
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - name: Publish Javadoc to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          workingDirectory: lib
  docs:
    name: Build docs

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - name: Check formatting with Oxfmt
        run: pnpm format
      - name: Build docs
        run: pnpm build
        working-directory: web
      - name: Check vendordep is downloadable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: central
        run: |
          version="$(cat version.txt)"
          http_status="$(curl --head --silent --show-error --connect-timeout 10 --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            "https://repo.maven.apache.org/maven2/dev/doglog/doglog/$version/doglog-$version.jar")"
          case "$http_status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo '::notice::Docs deployment deferred until the vendordep is available on Maven Central.' ;;
            *) echo "Unexpected Maven Central response: $http_status" >&2; exit 1 ;;
          esac
      - name: Publish docs to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.central.outputs.published == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          workingDirectory: web
