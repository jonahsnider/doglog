name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  openspec:
    name: Validate OpenSpec

    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      OPENSPEC_TELEMETRY: '0'

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      - name: Validate Studio specs
        run: pnpm --dir studio openspec:check

  assemble:
    name: Assemble

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Assemble project
        run: ./gradlew assemble :lib:plainJavadocJar :lib:generatePomFileForMavenPublication :lib:generateMetadataFileForMavenPublication
  style:
    name: Check formatting

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs: [assemble]

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Check formatting
        run: ./gradlew spotlessCheck
  infer:
    name: Infer

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs: [assemble]

    env:
      INFER_VERSION: v1.3.0

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Cache Infer
        id: cache-infer
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/infer
          key: infer-linux-x86_64-${{ env.INFER_VERSION }}
      - name: Install Infer
        if: steps.cache-infer.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/infer
          curl -sL "https://github.com/facebook/infer/releases/download/${INFER_VERSION}/infer-linux-x86_64-${INFER_VERSION}.tar.xz" \
            | tar xJ -C /tmp/infer
      - name: Add Infer to PATH
        run: echo "/tmp/infer/infer-linux-x86_64-${INFER_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Run Infer
        run: ./gradlew infer -PinferFailOnIssue

  assemble-test-project:
    name: Assemble test project

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs: [assemble]

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Assemble DogLog
        run: ./gradlew assemble
      - name: Assemble test project
        run: ./gradlew assemble
        working-directory: test-project
  style-test-project:
    name: Check test project formatting

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs: [assemble]

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Check formatting
        run: ./gradlew spotlessCheck
        working-directory: test-project
  javadoc:
    name: Publish Javadoc

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: [assemble]

    timeout-minutes: 10

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build
        run: ./gradlew javadoc
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      - name: Publish Javadoc to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          workingDirectory: lib
  docs:
    name: Build docs

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      - name: Check formatting with Oxfmt
        run: pnpm format
      - name: Build docs
        run: pnpm build
        working-directory: web
      - name: Check vendordep is downloadable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: central
        run: |
          version="$(cat version.txt)"
          http_status="$(curl --head --silent --show-error --connect-timeout 10 --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            "https://repo.maven.apache.org/maven2/dev/doglog/doglog/$version/doglog-$version.jar")"
          case "$http_status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo '::notice::Docs deployment deferred until the vendordep is available on Maven Central.' ;;
            *) echo "Unexpected Maven Central response: $http_status" >&2; exit 1 ;;
          esac
      - name: Publish docs to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.central.outputs.published == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          workingDirectory: web
  studio-robot-sftp:
    name: Studio robot SFTP

    runs-on: ubuntu-latest

    timeout-minutes: 15

    defaults:
      run:
        working-directory: studio/src-tauri

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          cache-workspaces: studio/src-tauri -> target
      - name: Test
        run: cargo test -p robot-sftp -- --include-ignored
  studio-rust:
    name: Studio Rust

    runs-on: ubuntu-latest

    timeout-minutes: 15

    defaults:
      run:
        working-directory: studio/src-tauri

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Install Linux dependencies
        timeout-minutes: 10
        run: |
          # Rebuilding the man page index after installing is slow and unused in CI
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          # Downloading usually takes under a minute, but a slow mirror can drag it out until the job times out
          # Retrying makes a new connection and keeps the packages already downloaded
          for attempt in 1 2 3; do
            sudo timeout 3m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --download-only libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::Downloading Linux dependencies took too long, retrying"
          done
          # Installed separately so the timeout can't interrupt dpkg partway through
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache-workspaces: studio/src-tauri -> target
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Create placeholder frontend build
        # Tauri embeds the frontend at compile time, but linting doesn't need a real build
        run: mkdir -p ../dist
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
  studio:
    name: Studio

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      - name: Lint, format, and type check
        run: pnpm check
        working-directory: studio
      - name: React Doctor
        # `pnpm doctor` is a built-in pnpm command
        run: pnpm react-doctor
        working-directory: studio
      - name: Test
        run: pnpm test
        working-directory: studio
      - name: Knip
        run: pnpm knip
      - name: Build
        run: pnpm build
        working-directory: studio
        env:
          # Only builds that deploy upload source maps to Sentry
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
      - name: Publish Studio to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          workingDirectory: studio
      - name: Finalize Sentry release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version="$(jq -r .version package.json)"
          pnpm exec sentry release finalize "jonah-snider/doglog-studio@$version"
        working-directory: studio
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  cloud:
    name: Cloud

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      - name: Lint, format, and type check
        run: pnpm check
        working-directory: cloud
      - name: Build
        run: pnpm build
        working-directory: cloud
      - name: Publish Cloud to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # `pnpm deploy` is a built-in pnpm command. Void builds again before deploying.
        run: pnpm run deploy
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  studio-benchmarks:
    name: Studio benchmarks

    runs-on: ubuntu-latest

    timeout-minutes: 15

    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.6.3
        with:
          run: pnpm --dir studio bench
          mode: simulation
