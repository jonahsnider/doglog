# Temporary: publishes every push to main as a desktop build for alpha/beta testers until Studio has real releases
# Delete this workflow once release-please starts releasing Studio, or it will overwrite the release's update manifest

name: Studio preview

on:
  push:
    branches:
      - main
    paths:
      - 'studio/**'
      - '!studio/openspec/**'
      - '!studio/scripts/field3d/**'
      - '!studio/DESIGN.md'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'rust-toolchain.toml'
      - '.github/workflows/studio-preview.yml'

# Only the newest build matters, so a new push cancels the one in progress
# Bot pushes get their own group so they don't cancel a build they won't replace
concurrency:
  group: studio-preview-${{ github.event.sender.type == 'Bot' && github.run_id || 'main' }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  # Immutable releases never free up a tag, so each build needs its own. Not a version, so release-please ignores it.
  TAG_NAME: studio-preview-${{ github.run_number }}
  # Always increasing so the updater sees each build as newer, and below the first real release so testers update to it
  VERSION: 0.0.${{ github.run_number }}

jobs:
  release:
    name: Create preview release
    # Bot pushes don't need a build of their own, and skipping this skips the jobs after it
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      # A draft, since assets can't be uploaded once an immutable release is published
      - name: Create draft release
        id: release
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" --draft --prerelease --target "$GITHUB_SHA" --title "Studio preview $VERSION" \
            --notes "Automatic preview build of $GITHUB_SHA for testers. Not a stable release."
          echo "id=$(gh release view "$TAG_NAME" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Studio desktop (${{ matrix.name }})
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Separate jobs so the architectures build in parallel, both on Apple silicon since cross-compiling takes about as long
          - name: macOS Apple silicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            runner: windows-latest
          - name: Linux
            # The oldest supported Ubuntu, so the AppImage runs on distros with an older glibc
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Set version
        shell: bash
        working-directory: studio
        run: |
          set -euo pipefail
          for file in package.json src-tauri/tauri.conf.json; do
            jq --arg version "$VERSION" '.version = $version' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Rebuilding the man page index after installing is slow and unused in CI
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          # Downloading usually takes under a minute, but a slow mirror can drag it out until the job times out
          # Retrying makes a new connection and keeps the packages already downloaded
          for attempt in 1 2 3; do
            sudo timeout 3m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --download-only libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::Downloading Linux dependencies took too long, retrying"
          done
          # Installed separately so the timeout can't interrupt dpkg partway through
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          # The macOS jobs share a runner OS, so keep their caches apart
          cache-key: ${{ matrix.target }}
          # A new lint in stable Rust shouldn't block shipping a build
          build-warnings: warn
          cache-workspaces: studio/src-tauri -> target
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      # `tauri.linux.conf.json` splits the debug info into its own file before bundling, so cargo has to leave it in
      - name: Keep Linux debug info for Sentry
        if: runner.os == 'Linux'
        run: |
          echo CARGO_PROFILE_RELEASE_STRIP=none >> "$GITHUB_ENV"
          echo CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=off >> "$GITHUB_ENV"
      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_CONVEX_URL: https://convex.doglog.studio
        with:
          projectPath: studio
          releaseId: ${{ needs.release.outputs.id }}
          # The publish job writes the manifest once every build is done, builds updating it themselves overwrite each other
          uploadUpdaterJson: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
      # Lets Sentry show function names and source lines for panics, a missing upload shouldn't block the release
      - name: Upload debug symbols to Sentry
        continue-on-error: true
        shell: bash
        working-directory: studio
        run: pnpm exec sentry debug-files upload --include-sources src-tauri/target/${{ matrix.target }}/release/doglog[-_]studio*
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: jonah-snider
          SENTRY_PROJECT: doglog-studio

  publish:
    name: Publish to testers
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      # Same as release-please.yml, fails if a platform's updater bundle or signature is missing
      - name: Create manifest
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          gh release download "$TAG_NAME" --pattern '*.sig' --dir "$dir/signatures"
          gh release view "$TAG_NAME" --json assets > "$dir/release.json"
          for file in "$dir"/signatures/*.sig; do
            jq -n --arg name "$(basename "$file" .sig)" --rawfile signature "$file" '{($name): $signature}'
          done | jq -s add > "$dir/signatures.json"
          jq -n --arg version "$VERSION" --slurpfile release "$dir/release.json" --slurpfile signatures "$dir/signatures.json" '
            def entry($suffix):
              [$release[0].assets[] | select(.name | endswith($suffix))] as $matches
              | if ($matches | length) != 1 then error("Expected 1 asset ending in \($suffix), found \($matches | length)") end
              | $matches[0]
              | {signature: ($signatures[0][.name] // error("No signature for \(.name)")), url: .apiUrl};
            {
              version: $version,
              pub_date: (now | todate),
              platforms: {
                "darwin-aarch64": entry("_aarch64.app.tar.gz"),
                "darwin-aarch64-app": entry("_aarch64.app.tar.gz"),
                "darwin-x86_64": entry("_x64.app.tar.gz"),
                "darwin-x86_64-app": entry("_x64.app.tar.gz"),
                "windows-x86_64": entry("_x64-setup.exe"),
                "windows-x86_64-nsis": entry("_x64-setup.exe"),
                "linux-x86_64": entry(".AppImage"),
                "linux-x86_64-appimage": entry(".AppImage"),
                "linux-x86_64-deb": entry(".deb")
              }
            }' > latest.json
      # The manifest links to the release's assets, which can't be downloaded while it's a draft
      - name: Publish release
        run: gh release edit "$TAG_NAME" --draft=false
      # Same fixed names as release-please.yml, so the download button in Studio gets the preview builds
      - name: Publish installers
        run: |
          set -euo pipefail
          publish() {
            local pattern="$1" key="$2"
            local dir
            dir="$(mktemp -d)"
            gh release download "$TAG_NAME" --pattern "$pattern" --dir "$dir"
            local files=("$dir"/*)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Expected 1 asset matching $pattern, found ${#files[@]}" >&2
              exit 1
            fi
            pnpm --dir studio exec wrangler r2 object put "doglog-updates/studio/$key" --file "${files[0]}" --content-type application/octet-stream --cache-control 'public, max-age=300' --remote
          }
          publish '*_aarch64.dmg' DogLog-Studio-macos-apple-silicon.dmg
          publish '*_x64.dmg' DogLog-Studio-macos-intel.dmg
          publish '*-setup.exe' DogLog-Studio-windows-setup.exe
          publish '*.AppImage' DogLog-Studio-linux.AppImage
          publish '*.deb' DogLog-Studio-linux.deb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish manifest
        run: pnpm --dir studio exec wrangler r2 object put doglog-updates/studio/latest.json --file ../latest.json --content-type application/json --cache-control 'public, max-age=300' --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Once the updater offers the build to testers
      - name: Finalize Sentry release
        run: pnpm exec sentry release finalize "jonah-snider/doglog-studio@$VERSION"
        working-directory: studio
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Testers only need the newest build, this also removes drafts left by cancelled runs
      - name: Delete older previews
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select((.tagName | startswith("studio-preview-")) and .tagName != env.TAG_NAME) | "\(.tagName) \(.isDraft)"' |
            while read -r tag draft; do
              # Drafts don't have a tag yet
              if [ "$draft" = true ]; then
                gh release delete "$tag" --yes
              else
                gh release delete "$tag" --cleanup-tag --yes
              fi
            done
