name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  studio:
    name: Studio

    runs-on: ubuntu-latest

    timeout-minutes: 15

    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.6.3
        with:
          run: pnpm --dir studio bench
          mode: simulation
