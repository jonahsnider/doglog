schema: spec-driven

context: |
  Product: DogLog Studio is an all-in-one app for FRC teams to review robot logs and debug robots live.
  It works with any WPILOG file or NetworkTables 4 (NT4) source, not only DogLog. Where it costs nothing,
  defaults favor DogLog conventions (ex. the console widget binding WPILib's `console` and `messages` entries).

  Update this context as needed, when information becomes outdated or new details emerge.

  Spec conventions:
  - Specs describe the target product, not a release phase. MVP/release scoping is tracked outside OpenSpec.
  - Specs describe user-facing behavior. Library and implementation choices belong here, not in requirements.
  - OpenSpec changes are not used. Edit `specs/` directly and run `openspec validate --specs`.

  Terminology, in the UI, specs, and code:
  - An entry is a whole logged item (name, type, metadata, and values), from a WPILOG entry or an NT4 topic.
  - An entry name is the `/`-separated string identifying an entry, ex. `/Robot/Arm/Angle`. Don't call it a key.

  Tech stack:
  - Frontend: React in the web ecosystem only. UI components from coss ui (https://coss.com/ui, Base UI + Tailwind CSS v4).
  - Charts: Base UI charts once released. It has not shipped yet; a temporary chart library is acceptable if it
    supports real-time streaming, as long as it stays behind the widget contract so it can be swapped later.
  - Core logic: TypeScript. Avoid other languages for core logic unless there's a strong reason.
  - WPILOG parsing: wpilog-parser. NT4 client: @ntcore-ts/client, patched with `pnpm patch` so topic properties
    (ex. `unit`) pass through its schema instead of being stripped, and so prefix subscribers hear when topics are
    unannounced, until that's fixed upstream.
  - Shared dashboards: each dashboard is a Loro CRDT document. Without internet, peers exchange snapshots and presence
    through the robot's NT4 server under `/DogLogStudio/`; peers are the source of truth, the server only relays.
  - Drawn widgets: plain SVG in React when the element count is small (ex. the swerve widget). Pick drawing
    libraries per widget when it's specced (ex. canvas for dense time series, three.js for 3D).
  - Field images: the season's community top-down CAD render from Chief Delphi (AdvantageScope uses the same ones), the
    variant without background or game pieces, over a fixed neutral gray, compressed as lossless WebP. Cropped with the
    SVG view, not by editing the image.
  - Infer how widgets show entries from entry types, metadata, and names. Widgets may declare a few options
    (`WidgetType.options`) to override what's inferred or pick what can't be; keep them rare so users aren't overloaded.
  - Distribution: a PWA website, plus a Tauri desktop app built from the same frontend.
  - Log sync: desktop only. Rust (the `robot-sftp` crate, russh) does SSH/SFTP listing and offset downloads, TypeScript
    decides what to sync and when. Only roboRIOs are supported; SystemCore support is planned for the 2027 release.
  - State: TanStack Store, with Zod validating all persisted and external data.
  - Interactions: dnd-kit for drag and drop, react-resizable-panels for pane splits, TanStack Hotkeys for shortcuts.
  - Theming: Material Design 3 "tonal spot" scheme (2025 spec) generated with @material/material-color-utilities from a seed
    color. The default seed is Team 581 maroon #591616, which matches jonahsnider/dashshund.
    Presets: Team 581 maroon, a custom seed, or Neutral, which uses coss ui's stock neutral tokens
    (https://coss.com/ui/docs/styling) with no generated scheme.
  - App icon: the DogLog logo (web/public/logo.svg), which is also the Team 581 logo.
  - Context menus: native Tauri popup menus on desktop, coss menus on the web, from one menu definition.
  - Agent control: one registry of commands defined in TypeScript with Zod, in a schema-only folder with no React or DOM
    imports (widget metadata like `accepts`, roles, and options lives apart from widget components). A build step exports
    the schemas with Zod's JSON Schema export, and the Rust binary embeds them, so `doglog --help`, CLI flag parsing, and
    MCP `tools/list` work without a window. Handlers run in the webview.
    - Web: WebMCP (`navigator.modelContext`), feature-detected.
    - Desktop: each app process listens on a per-user local socket (Unix socket with user-only permissions, or a named
      pipe restricted to the current user on Windows) and speaks MCP JSON-RPC; Rust relays calls to the webview. No
      network listener. `doglog mcp` is a stdio bridge that discovers every window's socket and launches the app when
      none is running. CLI subcommands are MCP clients over the same sockets.
    - Windows report an integer agent API version; the bridge refuses windows whose version differs from its own.
    - Tools only: no MCP resources, prompts, or change notifications.
    - `doglog mcp install` uses each agent's own installer (ex. `claude mcp add`, `codex mcp add`, `gemini mcp add`,
      `code --add-mcp`, Cursor's install deeplink), not add-mcp, so agents own their config formats.
  - Desktop-only shortcuts (⌘T, ⌘W, ⌘,): native app menu items on macOS, where the default menu already uses ⌘W, and
    TanStack Hotkeys on Windows and Linux.

  Platform constraints:
  - Browsers only allow live NT connections from an HTTPS page via Chrome's Local Network Access (Chrome 147+),
    and only when connecting by IP literal or localhost. Firefox support is unclear and Safari blocks it.
    The desktop app has no such restriction.

  Non-goals:
  - Explicit handling for browsers that can't make live NT connections (the connection simply fails).

  Future needs (not specced yet):
  - Mobile layouts.
  - Accounts, cloud sync, analytics, or telemetry.
  - Writing or editing NT values.
  - Comparing multiple logs at once, and multiple simultaneous data sources.
  - Protobuf-encoded entries.
  - Managed sync service for dashboards; dashboard import/export.
  - Saving a live session to a log file.
  - Playback looping and trimming the playback range.
  - FRC match time display (ex. "Teleop 1:32").
  - Recent files.
  - More FRC-specific widgets. Double-clicking matching entries should default to these once they exist.
  - A 3D field view, likely three.js with a field model per season.
  - Field widget seasons: WPILib 2027 moves the field origin to the center with +X toward blue. The field widget is
    hardcoded to the 2026 field and coordinates; switch to 2027 when it ships. Past seasons may not be supported.
  - Robot trails and per-project robot sizes in the field widget.
  - Keyboard zoom for the field widget. The desktop app could zoom it with ⌘+/⌘-, but it may be better to support the
    system's zoom gestures and settings instead.
  - Choosing robot-relative or field-relative for `ChassisSpeeds` in the swerve widget (currently always
    robot-relative).
  - Unit inference beyond angles (ex. distance, velocity).
  - A command palette. ⇧⌘P or ⌘P.
  - Agent screenshots of windows (agents use their harness's tools for now), and agent access to notepad text.

  Open questions:
  - Whether the sidebar's dashboard list fits every page long term, or pages need their own secondary content.
  - The live NT story for Firefox and Safari users of the web app.
  - Per-project defaults for common entries (ex. the robot pose is always /Robot/Localization/EstimatedPose).
    Possibly declared by robot code (ex. NT topic metadata or DogLog) instead of in Studio.

rules:
  specs:
    - Describe observable user behavior; leave library and implementation details to the config context
    - Keep requirements library-agnostic, especially for charts
