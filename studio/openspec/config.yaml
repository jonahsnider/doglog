schema: spec-driven

# When editing, keep info concise since this is read very frequently
# Avoid adding information specific to a single feature, this should be meant for high-level guidelines/decisions
# Ideally information is obvious from looking at the code, we should only add things here if they can't be communicated through the actual source
context: |
  Product: DogLog Studio is an all-in-one app for FRC teams to review robot logs and debug robots live.
  It works with any WPILOG file or NetworkTables 4 (NT4) source, not only DogLog. Where it costs nothing,
  defaults favor DogLog conventions.

  Update this context when it becomes outdated. Keep it to decisions and constraints that the code, package.json,
  `DESIGN.md`, and the specs don't already make clear.

  Spec conventions:
  - Specs describe the target product, not a release phase. MVP/release scoping is tracked outside OpenSpec.
  - Specs describe user-facing behavior. Library and implementation choices belong here, not in requirements.
  - OpenSpec changes are not used. Edit `specs/` directly and run `openspec validate --specs`.

  Terminology, in the UI, specs, and code:
  - An entry is a whole logged item (name, type, metadata, and values), from a WPILOG entry or an NT4 topic.
  - An entry name is the `/`-separated string identifying an entry, ex. `/Robot/Arm/Angle`. Don't call it a key.

  Architecture:
  - A PWA website, plus a Tauri desktop app built from the same React frontend.
  - Core logic is TypeScript. Rust only where the desktop app needs it (ex. SSH for log sync, the `doglog` CLI).
  - Charts use a temporary library until Base UI charts ship, kept behind the widget contract so it can be swapped.
  - Zod validates all persisted and external data.
  - Shared dashboards use one Loro CRDT document per dashboard, with an identity independent of robot addresses.
    For robot-only sharing, peers hold the documents and the robot's NT4 server only relays. A signed-in team
    member's Studio can relay its Cloud dashboards over NT4 to explicitly linked robots.
  - Cloud dashboard encryption: Studio generates a random shared team key and derives a separate AES encryption
    key for each dashboard in that key version. Authenticate and encrypt whole Loro updates and snapshots and
    bind them to the dashboard and key version. Joining does not rotate the team key. Ending membership or
    replacing a lost credential does.
  - Cloud dashboard sync: Web Crypto only, HKDF-SHA-256 for per-dashboard keys and AES-GCM-256 for updates. Cloud
    stores each dashboard as encrypted Loro updates in Convex with a per-dashboard sequence number, and Studio pulls
    only updates after the last one it imported. A member's Studio periodically uploads a snapshot that replaces the
    updates before it, and after a rotation re-uploads one under the current key. Cloud accepts an upload only from
    the membership the edits were made under and only under the current key version, checked in the same
    transaction, and rejects uploads while a rotation is pending.
  - Account keys: Each account has a public and private encryption keypair. Cloud can persist the public key and
    team key copies sealed to verified account public keys. Cloud signs attestations binding an account to its
    public key with a signing key kept outside the database. Do not attest a key solely because it is in storage.
    Studio verifies the attestation and binds each grant to its team, recipient, and key version. Cloud only
    stores a grant from a member who holds the current key, and the recipient relies on that check.
    Pairing transfers the account private key between instances of Studio. Cloud relays pairing messages but
    is not trusted to verify the receiving device. Studio verifies it through a code comparison on both devices.
    On the web, keep the wrapped account private key and its non-exportable wrapping key in account- and
    deployment-scoped IndexedDB storage. On desktop, keep the wrapping key in the OS credential store instead
    (the `keyring` crate). Do not require a separate unlock prompt or offer Cloud escrow.
  - Cloud sign-in: Convex Auth. The desktop app uses the OS's native sign-in where there is one (ex. macOS's
    AuthenticationServices, which needs a signed build with `doglog.studio` as an associated domain). Otherwise it
    follows RFC 8252: the default browser signs in on doglog.studio and returns the result through `doglog://`,
    encrypted to a key only the app that started it holds. Sign-in never carries the account private key.
    A pnpm patch to Convex Auth avoids requesting email and profile scopes, since Cloud only needs the account ID.
  - Cloud trust boundary: Trust the live service to attest account keys and order revocations, key grants, and
    uploads. Stored data alone cannot authorize a grant. Cloud never holds dashboard decryption keys, but a
    compromised live service can misdirect future grants.
  - Widgets infer how to show entries from entry types, metadata, and names. Widget options override what's inferred
    or pick what can't be; keep them rare so users aren't overloaded.
  - Agent commands live in one Zod registry with no React or DOM imports, so the Rust binary can embed their schemas
    and answer `doglog --help` and MCP `tools/list` without a window. The web app exposes them over WebMCP; desktop
    windows over a per-user local socket that `doglog mcp` relays to. No network listener.
  - Studio's website is static files. Cloud dashboard links replace snapshot URLs and their preview renderer.
    Previews use public metadata only and do not decode dashboard contents.
  - YouTube only plays embedded videos for pages on a website, so the desktop app's video widget loads
    `public/youtube-player.html` from doglog.studio and controls it with messages.
  - The 3D field model is converted from FIRST's official STEP file each season by a checked-in script, which runs
    OpenCascade's Python bindings, a uv project in `scripts/field3d`, to read the CAD (native, since WebAssembly takes minutes), strips
    fasteners and other hardware, simplifies, and compresses it to a GLB of about 2 MB that's committed and bundled.
    The CAD's AprilTags are plain, so the GLB holds WPILib's tag layout instead, and the widget draws their patterns.
    Redistributing a model derived from FIRST's CAD is an accepted risk: Studio is a free tool for students.
  - Error reporting runs in production builds only. The production web app also samples page-load and navigation
    timings, without URLs, referrers, or outgoing request tracing. No usage analytics, and never log contents or
    personal info (ex. hostnames).

  Platform constraints:
  - Browsers only allow live NT connections from an HTTPS page via Chrome's Local Network Access (Chrome 147+),
    and only when connecting by IP literal or localhost. Firefox support is unclear and Safari blocks it.
    The desktop app has no such restriction.

  Non-goals:
  - Explicit handling for browsers that can't make live NT connections (the connection simply fails).

  Future needs (not specced yet):
  - Comparing multiple logs at once, and multiple simultaneous data sources.
  - Protobuf-encoded entries.
  - Playback looping and trimming the playback range.
  - A command palette.
  - Field widget robot trails and per-project robot sizes.
  - A robot editor that writes `doglog.jsonc` from one CAD model.
  - DogLog logging the robot project, so Studio matches a log to its project without the user picking it.
  - Log sync from Systemcore, planned for the 2027 release.

  Open questions:
  - How to verify the Apple sign-in setup.
  - Whether the sidebar's dashboard list fits every page long term, or pages need their own secondary content.
  - The live NT story for Firefox and Safari users of the web app.
  - Per-project defaults for common entries (ex. the robot pose), possibly declared by robot code or `doglog.jsonc`.

rules:
  specs:
    - Describe observable user behavior; leave library and implementation details to the config context
    - Keep requirements library-agnostic, especially for charts
