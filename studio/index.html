<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>DogLog Studio</title>
		<script>
			// Apply the theme setting before render to avoid a flash of the wrong theme, src/settings.ts takes over after load
			{
				let theme;
				try {
					theme = JSON.parse(localStorage.getItem('doglog-studio:settings')).theme;
				} catch {}
				const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
