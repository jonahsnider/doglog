<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>DogLog Studio</title>
		<script>
			// Apply the theme and theme color settings before render to avoid a flash of the wrong colors, src/settings.ts takes
			// over after load
			{
				let theme;
				try {
					theme = JSON.parse(localStorage.getItem('doglog-studio:settings')).theme;
				} catch {}
				const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);

				// Colors generated from the theme color, cached by src/theme-color.ts under the same key
				let css;
				try {
					css = localStorage.getItem('doglog-studio:theme-color-css');
				} catch {}
				if (css) {
					const style = document.createElement('style');
					style.id = 'theme-color';
					style.textContent = css;
					document.head.append(style);
				}
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
