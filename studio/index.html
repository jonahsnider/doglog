<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- `viewport-fit=cover` makes iOS report its safe areas, which the app frame and the mobile sidebar keep content out of -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>DogLog Studio</title>
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		<meta name="description" content="Review FRC robot logs and debug robots live" />
		<!-- Link previews, the Studio Worker (worker/index.ts) changes them for dashboard links -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="DogLog Studio" />
		<meta property="og:title" content="DogLog Studio" />
		<meta property="og:description" content="Review FRC robot logs and debug robots live" />
		<meta property="og:image" content="https://doglog.studio/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="DogLog Studio" />
		<meta name="twitter:card" content="summary_large_image" />
		<script>
			// Apply the theme, theme color, and reduce motion settings before render to avoid a flash of the wrong colors or
			// animations, src/settings.ts takes over after load
			{
				let theme;
				let reduceMotion;
				try {
					const settings = JSON.parse(localStorage.getItem('doglog-studio:settings'));
					theme = settings.theme;
					reduceMotion = settings.reduceMotion;
				} catch {}
				const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.classList.toggle('reduce-motion', reduceMotion === true);

				// Colors generated from the theme color, cached by src/theme/theme-color.ts under the same key
				let css;
				try {
					css = localStorage.getItem('doglog-studio:theme-color-css');
				} catch {}
				if (css) {
					const style = document.createElement('style');
					style.id = 'theme-color';
					style.textContent = css;
					document.head.append(style);
				}
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
