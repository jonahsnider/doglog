[package]
name = "doglog-studio"
version = "0.0.0"
description = "Review FRC robot logs and debug robots live"
authors = ["Jonah Snider"]
license = "MIT"
repository = "https://github.com/jonahsnider/doglog"
homepage = "https://studio.doglog.dev"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["robot-sftp"]

[lib]
name = "doglog_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
clap = { version = "4", features = ["string"] }
robot-sftp = { path = "robot-sftp" }
tokio = "1"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
