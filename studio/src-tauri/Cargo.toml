[package]
name = "doglog-studio"
version = "0.0.0"
description = "Review FRC robot logs and debug robots live"
authors = ["Jonah Snider"]
license = "MIT"
repository = "https://github.com/jonahsnider/doglog"
homepage = "https://studio.doglog.dev"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["robot-sftp"]

[lib]
name = "doglog_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
clap = { version = "4", features = ["string"] }
robot-sftp = { path = "robot-sftp" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "time"] }
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
base64 = "0.23"
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
getrandom = "0.4"
tauri-plugin-mcp-bridge = "0.13"
sentry = { version = "0.49", default-features = false, features = [
	"backtrace",
	"contexts",
	# Lets Sentry match panics to the uploaded debug files
	"debug-images",
	"panic",
	"reqwest",
	"rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
codegen-units = 1
lto = true
# Line numbers for Sentry, kept out of the shipped binary: a dSYM on macOS, a PDB on Windows, and on Linux
# `tauri.linux.conf.json` splits them out before bundling
debug = "line-tables-only"
split-debuginfo = "packed"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDocumentController"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_System_Console",
] }
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-version = "0.1"
