[package]
name = "doglog-studio"
version = "0.0.0"
description = "Review FRC robot logs and debug robots live"
authors = ["Jonah Snider"]
license = "MIT"
repository = "https://github.com/jonahsnider/doglog"
homepage = "https://doglog.studio"
edition = "2024"
rust-version = "1.90"

[workspace]
members = ["robot-sftp"]

[lib]
name = "doglog_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
clap = { version = "4", features = ["string"] }
robot-sftp = { path = "robot-sftp" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "time"] }
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
base64 = "0.23"
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
getrandom = "0.4"
tauri-plugin-mcp-bridge = "0.13"
sentry = { version = "0.49", default-features = false, features = [
	"backtrace",
	"contexts",
	# Lets Sentry match panics to the uploaded debug files
	"debug-images",
	"panic",
	"reqwest",
	"rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Bundles liblzma instead of linking the system's, which macOS and Windows don't have
liblzma = { version = "0.4", features = ["static"] }

# Unoptimized, decompressing a large `.wpilogxz` log takes a few times longer
[profile.dev.package.liblzma-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
# Line numbers for Sentry, kept out of the shipped binary: a dSYM on macOS, a PDB on Windows, and on Linux
# `tauri.linux.conf.json` splits them out before bundling
debug = "line-tables-only"
split-debuginfo = "packed"
strip = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
	"std",
	"NSBitmapImageRep",
	"NSCell",
	"NSControl",
	"NSDocumentController",
	"NSGraphics",
	"NSGraphicsContext",
	"NSImage",
	"NSImageRep",
	"NSImageView",
	"NSView",
	"NSWindow",
	"objc2-core-graphics",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
	"std",
	"NSDictionary",
	"NSString",
	"NSURL",
	"NSValue",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
	"WKSnapshotConfiguration",
	"WKWebView",
	"block2",
	"objc2-core-foundation",
] }
tauri-plugin-macos-fps = "0.1.0"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
	"std",
	"AVAssetWriter",
	"AVAssetWriterInput",
	"AVMediaFormat",
	"AVVideoSettings",
	"block2",
	"objc2-core-media",
	"objc2-core-video",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
	"std",
	"CGBitmapContext",
	"CGColorSpace",
	"CGContext",
	"CGImage",
] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3", default-features = false, features = [
	"std",
	"CVBase",
	"CVBuffer",
	"CVImageBuffer",
	"CVPixelBuffer",
	"CVPixelBufferPool",
	"CVReturn",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_System_Console",
] }
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-version = "0.100"
webview2-com = "0.39"
